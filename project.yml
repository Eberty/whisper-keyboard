name: WhisperKeyboard

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1

targets:
  WhisperKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: Keyboard
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).whisperkeyboard
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WhisperKeyboard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Whisper
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Whisper Keyboard uses the microphone to transcribe your speech on this device.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Whisper Keyboard uses Face ID to unlock your History.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WhisperKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: WhisperKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).whisperkeyboard.tests

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).whisperkeyboard.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Whisper Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  WhisperKeyboard:
    build:
      targets:
        WhisperKeyboard: all
    # Run installs the release build, which is smaller and faster and has no test hooks; tests use -configuration Debug.
    test:
      config: Debug
      targets:
        - WhisperKeyboardTests
    run:
      config: Release
    archive:
      config: Release
